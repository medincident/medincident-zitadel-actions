repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: task-proto-fmt-check
        name: proto format check
        entry: task
        args: [proto:fmt:check]
        language: system
        files: '\.proto$'
        pass_filenames: false

      - id: task-proto-lint
        name: proto lint
        entry: task
        args: [proto:lint]
        language: system
        files: '\.proto$'
        pass_filenames: false

      - id: task-proto-breaking
        name: proto breaking-change check
        entry: task
        args: [proto:breaking]
        language: system
        files: '\.proto$'
        pass_filenames: false

      - id: task-gen-check
        name: generated code check
        entry: task
        args: [gen:check]
        language: system
        files: '\.proto$'
        pass_filenames: false

      - id: task-fmt-check
        name: Go format check
        entry: task
        args: [fmt:check]
        language: system
        files: '\.go$'
        pass_filenames: false

      - id: task-lint
        name: lint (Go)
        entry: task
        args: [lint]
        language: system
        pass_filenames: false

      - id: task-test
        name: unit tests
        entry: task
        args: [test:unit]
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: task-vuln
        name: vulnerability check
        entry: task
        args: [vuln]
        language: system
        pass_filenames: false
        stages: [pre-push]
