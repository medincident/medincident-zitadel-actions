version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/medincident/medincident-zitadel-actions/pkg

inputs:
  - directory: api/proto

plugins:
  - local:
      - go
      - tool
      - protoc-gen-go
    out: pkg
    opt:
      - paths=source_relative
