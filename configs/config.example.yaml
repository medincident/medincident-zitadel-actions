# Listen address for the HTTP server.
# Default: :8080
# address: ":8080"

# HMAC signing key for Zitadel webhook signature verification.
# This key must match the signing key configured in your Zitadel Targets.
# Required for production. If empty, HMAC verification is skipped (development only).
# signing_key: ${ZITADEL_SIGNING_KEY}

# Maximum allowed age of a signed request (replay protection).
# Uses Go duration format (e.g. 5m, 30s, 1m30s).
# Default: 5m
# signing_key_tolerance: 5m

# NATS connection settings.
nats:
  # NATS server URL.
  # Default: nats://localhost:4222
  # url: nats://localhost:4222

  # Maximum number of reconnect attempts. -1 means unlimited.
  # Default: -1
  # max_reconnects: -1

  # How long to wait between reconnect attempts.
  # Uses Go duration format (e.g. 2s, 500ms).
  # Default: 2s
  # reconnect_wait: 2s

# Redis connection and distributed lock settings.
redis:
  # Redis server address (host:port).
  # Default: localhost:6379
  # address: localhost:6379

  # Redis password. Leave empty if authentication is not required.
  # Default: ""
  # password: ${REDIS_PASSWORD}

  # Redis database index.
  # Default: 0
  # db: 0

  # Key prefix for distributed mutexes that enforce per-aggregate ordering during publish.
  # Default: medincident:lock:
  # lock_prefix: medincident:lock:

  # TTL for distributed locks. Should cover the worst-case publish retry window.
  # Default: 30s
  # lock_expiry: 30s

# NATS JetStream publish retry settings.
#
# Stream provisioning is NOT done by this service — operators must
# create the target JetStream stream out-of-band. Recommended config:
#   name:        zitadel
#   subjects:    ["zitadel.>"]
#   duplicates:  24h
# The publisher sets a Nats-Msg-Id header of the form
#   {instance_id}:{aggregate_type}:{aggregate_id}:{sequence}
# so JetStream deduplicates retries within the duplicate window.
publish:
  # Maximum number of publish retry attempts before giving up.
  # Default: 5
  # max_retries: 5

  # Initial backoff duration before the first retry.
  # Uses Go duration format. Backoff doubles on each attempt up to max_backoff.
  # Default: 200ms
  # initial_backoff: 200ms

  # Maximum backoff duration between retries.
  # Default: 5s
  # max_backoff: 5s

  # Maximum total time for all retry attempts. Must be less than HTTP write timeout (10s).
  # Default: 8s
  # max_elapsed_time: 8s

zerolog:
  # Global minimum log level.
  # Accepted values: trace | debug | info | warn | error | fatal | panic
  # Default: info
  # level: info

  # Append file:line caller information to every log entry.
  # Default: false
  # caller: false

  # Number of extra stack frames to skip when reporting caller location.
  # Only effective when caller: true.
  # Default: 0
  # caller_skip: 0

  # Include an automatic timestamp field in every log entry.
  # Default: true
  # timestamp: true

  # Timestamp format. Any Go time layout string is accepted.
  # Default: 2006-01-02T15:04:05Z07:00 (RFC 3339)
  # time_format: "2006-01-02T15:04:05Z07:00"

  # Force all timestamps to UTC regardless of the system timezone.
  # Default: false
  # time_utc: false

  # Static string fields added to every log entry.
  # Useful for tagging logs with service identity.
  # Default: none
  fields:
    service: medincident-zitadel-actions
    env: ${APP_ENV}

  # Output destinations. If empty, logs are discarded.
  # Default: one pretty console output to stdout.
  outputs:
    # ── Console output (stdout) ───────────────────────────────────────────────
    - type: console

      # Which standard stream to write to.
      # Accepted values: stdout | stderr
      # Default: stdout
      target: stdout

      # Minimum level for this output. Entries below this level are dropped
      # for this output only, regardless of the global level above.
      # Default: inherits global level
      # level: info

      # Human-readable (ConsoleWriter) formatting.
      # Default: true
      pretty: true

      # Disable ANSI color codes. Useful in CI or when piping output.
      # Default: false
      # no_color: false

      # Timestamp format used in pretty mode.
      # Overrides the global time_format for this output only.
      # Default: 15:04:05
      time_format: "15:04:05"

      # Display order of fields in pretty mode.
      # Uses zerolog field name constants.
      # Default: [time, level, caller, message]
      parts_order:
        - time
        - level
        - caller
        - message

      # Fields to hide from pretty mode output.
      # Default: none
      # parts_exclude: []

    # ── Console output (stderr, warnings only) ────────────────────────────────
    - type: console
      target: stderr
      level: warn
      pretty: true
      no_color: true

    # ── File output ───────────────────────────────────────────────────────────
    - type: file

      # Path to the log file.
      # The file is created if absent and appended to if it already exists.
      # Supports env var injection: path: ${LOG_FILE_PATH}
      path: /var/log/medincident-zitadel-actions/app.log

      # Minimum level for this output.
      level: warn

      # JSON formatting (pretty: false is default for file outputs).
      # Set to true to write pretty (human-readable) lines to the file instead.
      pretty: false

      # Timestamp format for this file output.
      time_format: "2006-01-02T15:04:05Z07:00"
