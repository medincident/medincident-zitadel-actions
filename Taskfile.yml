version: "3"

tasks:
  gen:
    desc: Generate Go code from remote protobuf definitions
    cmds:
      - go tool buf generate
      - go generate {{.ROOT_DIR}}/...

  gen:check:
    desc: Verify generated code is up to date (fails if `task gen` would produce changes)
    cmds:
      - task: gen
      - git diff --exit-code -- gen/

  lint:
    desc: Lint Go code
    cmds:
      - go tool golangci-lint run

  test:unit:
    desc: Run unit tests only
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (requires Docker)
    cmds:
      - go test -tags=integration -count=1 -timeout=10m -v ./test/integration/zitadel/

  test:
    desc: Run the full test suite (unit + integration)
    cmds:
      - task: test:unit
      - task: test:integration

  vuln:
    desc: Run Go vulnerability check
    cmds:
      - go tool govulncheck ./...
